name: OneBrand Daily Metrics Update
on:
  schedule:
    - cron: "0 14 * * 1-5"  # 8 AM MT, Monday-Friday only
  workflow_dispatch:
jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run metrics updater
        env:
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
        run: python update_metrics.py
      - name: Run budget chart updater
        env:
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
        run: python update_budget_chart_data.py
      - name: Run Task Name Setter.py
        env:
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
        run: python task_name_setter.py
