name: OneBrand Daily Metrics Update

on:
  schedule:
    # Runs every day at 6:00 AM UTC (adjustable)
    # 6 AM UTC = 11 PM MT (previous day) / midnight CT
    # Change the cron below to adjust timing:
    # "0 6 * * *"  = 6:00 AM UTC daily
    # "0 12 * * *" = 12:00 PM UTC daily
    # "0 14 * * *" = 2:00 PM UTC = 8 AM MT
    - cron: "0 14 * * 1-5"  # 8 AM MT, Monday-Friday only

  # Allows you to run this manually from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  update-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run metrics updater
        env:
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
        run: python update_metrics.py
